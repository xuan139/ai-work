services:
  ai-work:
    image: ${AI_WORK_IMAGE:-ghcr.io/xuan139/ai-work}:${AI_WORK_VERSION:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        AI_WORK_VERSION: ${AI_WORK_VERSION:-development}
    restart: unless-stopped
    user: "${AI_WORK_UID:-1000}:${AI_WORK_GID:-1000}"
    env_file:
      - .env
    environment:
      AI_WORK_VERSION: ${AI_WORK_VERSION:-development}
      NAS_LLM_BASE_URL: ${NAS_LLM_BASE_URL:-http://host.docker.internal:8080}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8081}
    ports:
      - "${AI_WORK_HTTP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${AI_WORK_DATA_DIR:-../../data}:/opt/ai-work/data
      - ${AI_WORK_STORAGE_DIR:-../../storage}:/opt/ai-work/storage
      - ${AI_WORK_NAS_DIR:-../../mock_nas}:/opt/ai-work/mock_nas
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
