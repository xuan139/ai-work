services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.8
    container_name: ai-work-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env
    environment:
      N8N_HOST: goldsys.io
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_PATH: /n8n/
      N8N_EDITOR_BASE_URL: https://goldsys.io/n8n/
      WEBHOOK_URL: https://goldsys.io/n8n/
      N8N_PROXY_HOPS: 1
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Taipei
      TZ: Asia/Taipei
    volumes:
      - ./data:/home/node/.n8n
      - ./bootstrap:/bootstrap:ro

