# Include these directives in the AI Work server/location block.
# The application enforces the same 2 GB default with AI_WORK_MAX_UPLOAD_BYTES.
client_max_body_size 2g;
client_body_timeout 3600s;
proxy_request_buffering off;
proxy_connect_timeout 60s;
proxy_send_timeout 3600s;
proxy_read_timeout 3600s;
send_timeout 3600s;
