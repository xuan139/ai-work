# Include these directives in the AI Work server/location block.
# The application enforces the same 2 GB default with AI_WORK_MAX_UPLOAD_BYTES.
client_max_body_size 2g;
client_body_timeout 3600s;
proxy_request_buffering off;
proxy_connect_timeout 60s;
proxy_send_timeout 3600s;
proxy_read_timeout 3600s;

# Security baseline for the public HTTPS virtual host.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
send_timeout 3600s;
