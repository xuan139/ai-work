name: Release self-hosted package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 1.0.0-rc1
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            AI_WORK_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-work:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ai-work:latest

      - name: Build Ubuntu installation package
        run: |
          mkdir -p dist/package
          cp -R app static deploy docs requirements*.txt Dockerfile .dockerignore README.md LICENSE VERSION dist/package/
          printf '%s\n' "${VERSION}" > dist/package/VERSION
          tar -C dist/package -czf "dist/ai-work-${VERSION}-ubuntu.tar.gz" .
          sha256sum "dist/ai-work-${VERSION}-ubuntu.tar.gz" > "dist/ai-work-${VERSION}-ubuntu.tar.gz.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-work-${{ env.VERSION }}-ubuntu
          path: |
            dist/ai-work-${{ env.VERSION }}-ubuntu.tar.gz
            dist/ai-work-${{ env.VERSION }}-ubuntu.tar.gz.sha256

      - name: Attach package to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${VERSION}"
          "dist/ai-work-${VERSION}-ubuntu.tar.gz"
          "dist/ai-work-${VERSION}-ubuntu.tar.gz.sha256"
          --clobber
