name: Release self-hosted package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 1.0.0-rc1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Ubuntu installation package
        run: |
          mkdir -p dist/package/deploy
          cp -R app static docs requirements*.txt README.md LICENSE VERSION dist/package/
          cp -R deploy/self-hosted dist/package/deploy/
          cp deploy/nginx-ai-work-upload.conf deploy/ai-work-embedding.service dist/package/deploy/
          printf '%s\n' "${VERSION}" > dist/package/VERSION
          bash -n dist/package/deploy/self-hosted/*.sh
          tar -C dist/package -czf "dist/ai-work-${VERSION}-ubuntu.tar.gz" .
          sha256sum "dist/ai-work-${VERSION}-ubuntu.tar.gz" > "dist/ai-work-${VERSION}-ubuntu.tar.gz.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-work-${{ env.VERSION }}-ubuntu
          path: |
            dist/ai-work-${{ env.VERSION }}-ubuntu.tar.gz
            dist/ai-work-${{ env.VERSION }}-ubuntu.tar.gz.sha256

      - name: Attach package to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${VERSION}"
          "dist/ai-work-${VERSION}-ubuntu.tar.gz"
          "dist/ai-work-${VERSION}-ubuntu.tar.gz.sha256"
          --clobber
